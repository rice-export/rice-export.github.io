<!DOCTYPE html>
<html>
<head><title>Identify Images</title>
<style>
body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.card { background: #222; border-radius: 8px; overflow: hidden; text-align: center; }
.card img { width: 100%; height: 220px; object-fit: cover; }
.card p { padding: 8px; font-size: 18px; font-weight: bold; color: #FFD700; margin: 0; }
</style>
</head>
<body>
<h2>Which image is which? Tell me: temp-01 = Product Name, temp-02 = Product Name ...</h2>
<div class="grid">
<div class="card"><img src="assets/products/temp-01.png"/><p>temp-01</p></div>
<div class="card"><img src="assets/products/temp-02.png"/><p>temp-02</p></div>
<div class="card"><img src="assets/products/temp-03.png"/><p>temp-03</p></div>
<div class="card"><img src="assets/products/temp-04.png"/><p>temp-04</p></div>
<div class="card"><img src="assets/products/temp-05.png"/><p>temp-05</p></div>
<div class="card"><img src="assets/products/temp-06.png"/><p>temp-06</p></div>
<div class="card"><img src="assets/products/temp-07.png"/><p>temp-07</p></div>
<div class="card"><img src="assets/products/temp-08.png"/><p>temp-08</p></div>
<div class="card"><img src="assets/products/temp-09.png"/><p>temp-09</p></div>
<div class="card"><img src="assets/products/temp-10.png"/><p>temp-10</p></div>
</div>
</body>
</html>
